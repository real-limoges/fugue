name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'priv/static/sandbox/melbourne_weather.csv'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    uses: real-limoges/real-complex/.github/workflows/deploy-service.yml@main
    with:
      service_name: fugue
      service_account: fugue-runner@realcomplex-prod.iam.gserviceaccount.com
