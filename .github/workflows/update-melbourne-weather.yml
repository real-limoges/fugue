name: Update Melbourne Weather

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Refresh menagerie weather dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh dataset
        run: python3 .github/scripts/refresh_melbourne_weather.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet priv/static/menagerie/melbourne_weather.csv; then
            echo "No changes — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add priv/static/menagerie/melbourne_weather.csv
          git commit -m "chore: refresh Melbourne weather dataset"
          git push