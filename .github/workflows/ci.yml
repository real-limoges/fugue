name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 surrealdb/surrealdb:latest start --user root --pass root memory
          for i in $(seq 1 15); do curl -sf http://localhost:8000/health && break || sleep 1; done

      - name: Set up Elixir & OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Import SurrealDB schema
        run: |
          curl -s --show-error --fail-with-body http://localhost:8000/sql \
            -H "Accept: application/json" \
            -H "surreal-ns: fugue_test" \
            -H "surreal-db: graph_test" \
            -u root:root \
            --data-binary @priv/surrealdb/schema.surql

      - name: Install dependencies
        run: mix deps.get

      - name: Precommit checks (compile + format + test)
        run: mix precommit
