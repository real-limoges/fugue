services:
  fugue:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PHX_SERVER: "true"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      PHX_HOST: "${PHX_HOST:-localhost}"
      PORT: "4000"
      DATABASE_PATH: "/data/fugue.db"
    volumes:
      - fugue_data:/data
    restart: unless-stopped
    depends_on:
      - garcon

  garcon:
    build: ../garcon
    ports:
      - "${PORT:-4001}:4001"
    environment:
      PORT: "4001"
    volumes:
      - garcon_data:/data
    restart: unless-stopped

volumes:
  fugue_data:
  garcon_data:
